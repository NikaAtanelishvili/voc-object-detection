# E0a-yolo-timing-n (P4.3, DEVIATIONS 2026-10-29): 3 full-data epochs of yolo26n to time real epochs
# for the §5 E2 estimate. close_mosaic=1 makes epoch 2 a warm mosaic epoch and epoch 3 a no-mosaic
# epoch (a 50-epoch run has 40 mosaic and 10 no-mosaic epochs); results.csv "time" is cumulative s.
exp_id: E0a_yolo_timing_n
seed: 42
train:
  weights: yolo26n.pt
  epochs: 3
  imgsz: 640
  batch: 16
  close_mosaic: 1
kaggle:
  command: >-
    vocdet train-yolo --config configs/experiments/E0a_yolo_timing_n.yaml --data-dir kaggle
    --out-dir {run_dir}
  gpu: true
  pip: ["ultralytics==8.4.191"]
  sources: ["vocdet-prepare-data"]
  pull_pattern: '(kaggle_run\.json|command\.log|config\.yaml|run_meta\.json|train_log\.csv|metrics_val\.json|predictions_val\.json)$'
