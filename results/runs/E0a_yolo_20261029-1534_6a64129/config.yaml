# E0a-yolo (PLAN.md P4.3): smoke run. 64 train images, 1 epoch, 64 val images. Checks the YOLO pipeline
# end to end on the GPU (dataset root, Ultralytics train, predict + evaluate, val cross-check).
exp_id: E0a_yolo
seed: 42
train:
  weights: yolo26n.pt
  epochs: 1
  imgsz: 640
  batch: 16
  limit_train_images: 64
  limit_val_images: 64
kaggle:
  command: >-
    vocdet train-yolo --config configs/experiments/E0a_yolo.yaml --data-dir kaggle
    --out-dir {run_dir}
  gpu: true
  pip: ["ultralytics==8.4.191"]
  sources: ["vocdet-prepare-data"]
  # Weights stay on Kaggle; pull logs, metrics, predictions, and run metadata.
  pull_pattern: '(kaggle_run\.json|command\.log|config\.yaml|run_meta\.json|train_log\.csv|metrics_val\.json|predictions_val\.json)$'
