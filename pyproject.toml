[project]
name = "vocdet"
version = "0.1.0"
description = "Pascal VOC 2012 object detection: Faster R-CNN vs YOLO26, CPU optimization, FastAPI + Gradio service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nikoloz Atanelishvili" }]
dependencies = [
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
]

[project.scripts]
vocdet = "vocdet.cli:main"

[dependency-groups]
dev = [
    "huggingface-hub==2.3.0",
    "jinja2==3.1.6",
    "kaggle==2.2.5 ; python_full_version >= '3.11'",
    "pre-commit==4.7.0 ; python_full_version >= '3.11'",
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocdet"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, N naming,
# T20 forbids print() (library code must use logging; scripts may opt out per file).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is not a package; this lets tests import e.g. `kaggle_run` directly.
pythonpath = ["scripts"]
addopts = "-ra --strict-markers"

# CPU-only PyTorch wheels (CI and the CPU deployment target never need CUDA; Kaggle uses its
# preinstalled GPU build). `explicit` means only the packages mapped below use this index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
