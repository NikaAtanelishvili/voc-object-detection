# Lint + tests on every push and PR. CPU only: torch/torchvision resolve from the CPU wheel index
# configured in pyproject.toml ([tool.uv.sources]), and tests never need the real dataset or weights.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Pinned image: ubuntu-latest is migrating to Ubuntu 26, which would change CI mid-project.
    runs-on: ubuntu-24.04
    strategy:
      # Report both versions even if one fails.
      fail-fast: false
      matrix:
        # 3.11: PLAN.md baseline. 3.13: the Kaggle kernel runtime and the app Docker image.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: make check
        run: make check
