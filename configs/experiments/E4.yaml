# E4 (PLAN.md §5): YOLO26n as E2 with minimal augmentation (fliplr kept).
# Question: what does augmentation buy?
exp_id: E4
seed: 42
train:
  weights: yolo26n.pt
  epochs: 50
  imgsz: 640
  batch: 16
  patience: 15
  augment:
    mosaic: 0.0
    mixup: 0.0
    hsv_h: 0.0
    hsv_s: 0.0
    hsv_v: 0.0
    scale: 0.0
    translate: 0.0
kaggle:
  command: vocdet train-yolo --config configs/experiments/E4.yaml --data-dir kaggle --out-dir {run_dir}
  gpu: true
  pip: ["ultralytics==8.4.191"]
  sources: ["vocdet-prepare-data"]
  pull_pattern: '(kaggle_run\.json|command\.log|config\.yaml|run_meta\.json|train_log\.csv|metrics_val\.json|predictions_val\.json|weights/best\.pt)$'
