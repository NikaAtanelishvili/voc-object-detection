# E5 (PLAN.md §5): YOLO26n as E2 with the first 10 layers (the backbone) frozen.
# Question: full fine-tune vs frozen backbone (cost and accuracy).
exp_id: E5
seed: 42
train:
  weights: yolo26n.pt
  epochs: 50
  imgsz: 640
  batch: 16
  patience: 15
  freeze: 10
kaggle:
  command: vocdet train-yolo --config configs/experiments/E5.yaml --data-dir kaggle --out-dir {run_dir}
  gpu: true
  pip: ["ultralytics==8.4.191"]
  sources: ["vocdet-prepare-data"]
  pull_pattern: '(kaggle_run\.json|command\.log|config\.yaml|run_meta\.json|train_log\.csv|metrics_val\.json|predictions_val\.json|weights/best\.pt)$'
