# E6n (ADR-015): gentle fine-tune of YOLO26n. All 20 COCO head rows are copied, the LR stays near what
# the 3-epoch timing run saw, and the schedule is short, so the COCO features are not forgotten.
# Mosaic stops for the last 3 epochs: the timing run's jump came in its no-mosaic low-LR epoch.
exp_id: E6n
seed: 42
train:
  weights: yolo26n.pt
  epochs: 8
  imgsz: 640
  batch: 16
  close_mosaic: 3
  optimizer: AdamW
  lr0: 0.0002
  momentum: 0.9
  warmup_epochs: 1.0
  full_coco_head: true
kaggle:
  command: vocdet train-yolo --config configs/experiments/E6n.yaml --data-dir kaggle --out-dir {run_dir}
  gpu: true
  pip: ["ultralytics==8.4.191"]
  sources: ["vocdet-prepare-data"]
  pull_pattern: '(kaggle_run\.json|command\.log|config\.yaml|run_meta\.json|train_log\.csv|metrics_val\.json|predictions_val\.json|weights/best\.pt)$'
