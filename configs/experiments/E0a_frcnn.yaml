# E0a-frcnn (PLAN.md P3.4): smoke run. 64 train images, 1 epoch, 64 val images. Checks the pipeline end
# to end on the GPU and measures seconds per iteration, used to update the §5 estimate for E1.
exp_id: E0a_frcnn
seed: 42
model:
  pretrained: true
  min_size: 600
  max_size: 1000
train:
  epochs: 1
  batch_size: 8
  lr: 0.01
  warmup_iters: 4
  milestones: []
  amp: true
  num_workers: 2
  eval_every: 1
  limit_train_images: 64
  limit_val_images: 64
kaggle:
  command: >-
    vocdet train-frcnn --config configs/experiments/E0a_frcnn.yaml --data-dir kaggle
    --out-dir {run_dir}
  gpu: true
  sources: ["vocdet-prepare-data"]
  pull_pattern: '(kaggle_run\.json|command\.log|config\.yaml|run_meta\.json|train_log\.csv|val_log\.csv|metrics_val\.json|predictions_val\.json)$'
