# E1 (PLAN.md §5): two-stage baseline. Faster R-CNN MobileNetV3-L FPN from COCO weights, our own loop.
exp_id: E1
seed: 42
model:
  pretrained: true
  min_size: 600
  max_size: 1000
train:
  epochs: 12
  batch_size: 8
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  warmup_iters: 500
  warmup_factor: 0.001
  milestones: [8, 11]
  gamma: 0.1
  amp: true
  num_workers: 2
  eval_every: 2
kaggle:
  command: vocdet train-frcnn --config configs/experiments/E1.yaml --data-dir kaggle --out-dir {run_dir}
  gpu: true
  sources: ["vocdet-prepare-data"]
  # Weights (~2 x 75 MB) stay on Kaggle; pull logs, metrics, predictions, and run metadata.
  pull_pattern: '(kaggle_run\.json|command\.log|config\.yaml|run_meta\.json|train_log\.csv|val_log\.csv|metrics_val\.json|predictions_val\.json)$'
